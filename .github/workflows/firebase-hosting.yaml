name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: magic-box-b8bdc

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    uses: ./.github/workflows/test.yaml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-preview:
    name: deploy-preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Deploy Firebase preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGIC_BOX_B8BDC }}
          projectId: ${{ env.GCP_PROJECT_ID }}

  preview-skipped:
    name: preview-skipped
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Explain fork preview skip
        run: echo "Firebase preview skipped for fork PR; all tests ran without repository secrets (tests=${{ needs.tests.result }})."

  deploy-live:
    name: deploy-live
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Deploy Firebase live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGIC_BOX_B8BDC }}
          channelId: live
          projectId: ${{ env.GCP_PROJECT_ID }}
