name: WASM shipping profiles

on:
  pull_request:
    paths:
      - "wasmModules/**"
      - ".github/workflows/wasm-profiles.yaml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref used for the same-job package baseline
        required: false
        default: main

permissions:
  contents: read

jobs:
  measure:
    name: measure 3/s/z shipping profiles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Record build toolchain
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/magic-box-wasm-profiles"
          mkdir -p "$output"
          rustc_path="$(rustup which rustc)"
          cargo_path="$(rustup which cargo)"
          {
            echo "rustc_path=$rustc_path"
            "$rustc_path" -Vv
            echo "cargo_path=$cargo_path"
            "$cargo_path" --version
            echo 'wasm-pack --version'
            wasm-pack --version
            echo 'node --version'
            node --version
            echo 'strace --version'
            strace --version
          } > "$output/toolchain.txt"

      - name: Prepare exact base revision
        id: baseline
        env:
          BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref }}
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/magic-box-math565-baseline"
          rm -rf "$baseline"
          mkdir -p "$baseline"
          baseline_sha="$(bash wasmModules/math-box/bench/prepare-baseline.sh "$BASELINE_REF" "$baseline")"
          {
            echo "path=$baseline"
            echo "requested_ref=$BASELINE_REF"
            echo "sha=$baseline_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Measure candidate and baseline packages
        env:
          CARGO_NET_OFFLINE: "false"
          REQUIRE_TOOL_METADATA: "1"
          WASM_BASELINE_ROOT: ${{ steps.baseline.outputs.path }}
          WASM_BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          bash wasmModules/math-box/bench/measure-shipping-profiles.sh \
            "$RUNNER_TEMP/magic-box-wasm-profiles"

      - name: Record baseline revision
        env:
          BASELINE_REQUESTED_REF: ${{ steps.baseline.outputs.requested_ref }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$BASELINE_SHA")" = commit
          {
            echo "candidate=$(git rev-parse HEAD)"
            echo "baseline_requested_ref=$BASELINE_REQUESTED_REF"
            echo "baseline_sha=$BASELINE_SHA"
          } > "$RUNNER_TEMP/magic-box-wasm-profiles/revisions.txt"

      - name: Upload profile measurements and packages
        uses: actions/upload-artifact@v7
        with:
          name: wasm-profile-matrix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/magic-box-wasm-profiles/toolchain.txt
            ${{ runner.temp }}/magic-box-wasm-profiles/revisions.txt
            ${{ runner.temp }}/magic-box-wasm-profiles/3
            ${{ runner.temp }}/magic-box-wasm-profiles/s
            ${{ runner.temp }}/magic-box-wasm-profiles/z
          if-no-files-found: error
          retention-days: 14
