name: Deploy Firebase preview

on:
  workflow_dispatch:

concurrency:
  group: firebase-manual-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    uses: ./.github/workflows/test.yaml
    permissions:
      actions: read
      contents: read

  deploy-preview:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Deploy Firebase preview channel
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAGIC_BOX_B8BDC }}
          channelId: manual-preview
          expires: 7d
          projectId: magic-box-b8bdc

      - name: Publish preview link
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: printf '[Open Firebase preview](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
