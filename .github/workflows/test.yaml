name: Test

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false

env:
  NODE_VERSION: 22
  BUN_VERSION: 1.3.4
  WASM_PACK_VERSION: v0.15.0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_wasm: ${{ steps.detect.outputs.rust_wasm }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - name: Check out PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "rust_wasm=true" >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${EVENT_NAME}): running full Rust/WASM and functions suites."
            exit 0
          fi

          # fail open if the checkout is not a synthetic PR merge commit
          if ! git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            echo "rust_wasm=true" >> "$GITHUB_OUTPUT"
            echo "functions=true" >> "$GITHUB_OUTPUT"
            echo "Checkout is not a PR merge commit; failing open to full suites."
            exit 0
          fi

          changed_files="$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed_files"

          rust_wasm=false
          if printf '%s\n' "$changed_files" | grep -Eq '^(wasmModules/|\.github/workflows/wasm-profiles\.yaml$|scripts/build-wasm\.sh$)'; then
            rust_wasm=true
          fi

          functions=false
          if printf '%s\n' "$changed_files" | grep -Eq '^(functions/|firestore\.rules$)'; then
            functions=true
          fi

          echo "rust_wasm=${rust_wasm}" >> "$GITHUB_OUTPUT"
          echo "functions=${functions}" >> "$GITHUB_OUTPUT"
          echo "Detected: rust_wasm=${rust_wasm}, functions=${functions}"

  wasm-build:
    name: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7

      # exact match only: never restore stale pkg/ outputs when Rust sources change
      - name: Cache compiled WASM packages
        id: wasm-pkg-cache
        uses: actions/cache@v6
        with:
          path: |
            wasmModules/base64-box/pkg
            wasmModules/math-box/pkg
          key: wasm-pkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('wasmModules/**/Cargo.lock', 'wasmModules/**/Cargo.toml', 'wasmModules/**/src/**', 'scripts/build-wasm.sh') }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: false

      - name: Read Rust toolchain
        id: toolchain
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "version=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo and wasm-pack build artifacts
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
            wasmModules/base64-box/target
            wasmModules/math-box/target
          key: wasm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('wasmModules/**/Cargo.lock', 'wasmModules/**/Cargo.toml', 'wasmModules/**/src/**', 'scripts/build-wasm.sh') }}
          restore-keys: |
            wasm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-${{ env.WASM_PACK_VERSION }}-
            wasm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.version }}-

      - name: Install wasm-pack
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: ${{ env.WASM_PACK_VERSION }}

      - name: Build WASM packages
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-wasm.sh

      - name: Package WASM artifacts
        run: tar -czf wasm-modules.tar.gz wasmModules/base64-box/pkg wasmModules/math-box/pkg

      - name: Upload WASM artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: wasm-modules
          path: wasm-modules.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: build
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build application
        run: bun run build
        env:
          # Keep local and PR builds free of production Sentry secrets.
          CI: false
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.FIREBASE_APPCHECK_SITE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: Upload shipping artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: shipping-build
          path: build
          if-no-files-found: error
          retention-days: 1

  feedback-tests:
    name: feedback-tests
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install feedback receiver dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Validate schema, handler and transaction behavior
        run: npm test --prefix functions

  unit-tests:
    name: unit-tests (${{ matrix.shard }}/3)
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: bun run test --run --shard=${{ matrix.shard }}/3

      - name: Run date and timezone tests in Los Angeles
        if: matrix.shard == 1
        run: >
          bunx --no-install vitest run
          src/functions/__test__/timezone.test.ts
          src/contexts/__test__/PreferencesContext.test.tsx
          src/pages/SettingsPage.test.tsx
          src/modules/boxSources/__test__/CronExpressionBoxSource.test.ts
          src/modules/boxSources/__test__/DateCalculateBoxSource.test.ts
          src/modules/boxSources/__test__/NowBoxSource.test.ts
          src/modules/boxSources/__test__/TimestampBoxSource.test.ts
          src/modules/boxSources/__test__/WeekNumberBoxSource.test.ts
          src/modules/boxSources/__test__/sourceContracts.test.ts
          src/modules/boxSources/__test__/timezoneWiring.test.ts
          --reporter=dot
        env:
          TZ: America/Los_Angeles

      - name: Test bundle budget fixtures
        if: matrix.shard == 1
        run: bun run test:bundle-budget

  static-checks:
    name: static-checks
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run Biome checks
        run: bunx --no-install biome ci src cypress -- *.config.ts scripts/check-bundle-budget.mjs scripts/check-bundle-budget.test.mjs

      - name: Check documentation generator formatting
        run: >-
          bunx --no-install biome ci scripts/generate-tool-docs.mjs
          scripts/generate-tool-docs.test.mjs
          wasmModules/math-box/bench/compare.mjs
          wasmModules/math-box/bench/compare.test.mjs

      - name: Type-check application
        run: bun run typecheck

      - name: Type-check Cypress
        run: bun run typecheck:cypress

      - name: Check generated documentation
        run: bun run docs:check

      - name: Verify benchmark report writer
        run: bun run test:math-box-compare

  codespell:
    name: codespell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: codespell-project/codespell-problem-matcher@v1

      - name: Codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          skip: "./public/images/*,./public/apple-touch-icon.png,./public/favicon.ico,./bun.lock,./wasmModules/math-box/src/*,./wasmModules/math-box/README.md,./wasmModules/math-box/pkg/*"

  cypress-component:
    name: cypress-component
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup Cypress
        uses: ./.github/actions/setup-cypress

      - name: Run Cypress component tests
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_DEBUG: 1
        with:
          component: true
          install: false

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-component-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  cypress-e2e:
    name: cypress-e2e (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: inputs
            spec: cypress/e2e/magicbox.cy.ts
          - name: ui
            spec: cypress/e2e/magicbox-ui.cy.ts
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup Cypress
        uses: ./.github/actions/setup-cypress

      - name: Run Cypress E2E tests against the shipping artifact
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_DEBUG: 1
          CYPRESS_BASE_URL: http://localhost:4173
        with:
          install: false
          browser: chrome
          spec: ${{ matrix.spec }}
          start: bun run preview -- --host 0.0.0.0
          wait-on: http://localhost:4173

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-e2e-${{ matrix.name }}-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  offline-smoke:
    name: offline-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup Cypress
        uses: ./.github/actions/setup-cypress

      - name: Run offline smoke test against the shipping artifact
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_DEBUG: 1
          CYPRESS_BASE_URL: http://localhost:4173
        with:
          install: false
          browser: chrome
          spec: cypress/e2e/offline.cy.ts
          start: bun run preview -- --host 0.0.0.0
          wait-on: http://localhost:4173

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-offline-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  math-offline-smoke:
    name: math-offline-smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-modules
          path: .

      - name: Restore WASM packages
        run: tar -xzf wasm-modules.tar.gz

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup Cypress
        uses: ./.github/actions/setup-cypress

      - name: Run math WASM offline recovery test
        run: bun run test:e2e:offline-math -- --browser chrome
        env:
          CYPRESS_DEBUG: 1
          MATH_WASM_TEST_BUILD_DIR: build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-math-offline-failures
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7

  bundle-budget:
    name: bundle-budget
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download shipping artifact
        uses: actions/download-artifact@v8
        with:
          name: shipping-build
          path: build

      - name: Download latest successful main budget report when available
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .budget-baseline
          main_run="$(gh run list --workflow firebase-hosting.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$main_run" ]; then
            gh run download "$main_run" --name bundle-budget-metrics --dir .budget-baseline || true
          fi

      - name: Check bundle budgets
        shell: bash
        run: |
          baseline_arg=()
          baseline_file="$(find .budget-baseline -type f -name bundle-budget-report.json -print -quit 2>/dev/null || true)"
          if [ -n "$baseline_file" ]; then
            baseline_arg=(--baseline "$baseline_file")
          fi
          node scripts/check-bundle-budget.mjs --build-dir build --output bundle-budget-report.json "${baseline_arg[@]}"

      - name: Upload bundle budget report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-budget-metrics
          path: bundle-budget-report.json
          if-no-files-found: warn

  rust-tests:
    name: rust-tests
    needs: changes
    if: needs.changes.outputs.rust_wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasmModules/base64-box/target
            wasmModules/math-box/target
          key: rust-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('wasmModules/**/Cargo.lock', 'wasmModules/**/Cargo.toml', 'wasmModules/**/src/**', 'wasmModules/**/tests/**') }}
          restore-keys: rust-tests-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run all native Rust tests
        shell: bash
        run: |
          set -euo pipefail
          for module_dir in wasmModules/*/; do
            cargo test --all-targets --locked --manifest-path "${module_dir}Cargo.toml"
          done

  wasm-browser-tests:
    name: wasm-browser-tests (${{ matrix.module }}, ${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.rust_wasm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [base64-box, math-box]
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/.wasm-pack
            wasmModules/${{ matrix.module }}/target
          key: wasm-browser-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.module }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles(format('wasmModules/{0}/Cargo.lock', matrix.module), format('wasmModules/{0}/Cargo.toml', matrix.module), format('wasmModules/{0}/src/**', matrix.module), format('wasmModules/{0}/tests/**', matrix.module)) }}
          restore-keys: |
            wasm-browser-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.module }}-${{ env.WASM_PACK_VERSION }}-
            wasm-browser-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.module }}-

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: ${{ env.WASM_PACK_VERSION }}

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Run wasm-bindgen tests
        working-directory: wasmModules/${{ matrix.module }}
        run: wasm-pack test --${{ matrix.browser }} --headless
