[package]
name = "base64-box"
version = "0.1.0"
edition = "2021"

[lib]
name = "base64_box"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# rustc emits bulk-memory instructions for the optimized base64 implementation.
# Keep wasm-opt enabled and pass the feature needed to validate those instructions.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[dependencies]
base64 = "0.23"
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
